[project]
name = "truco-eval"
version = "0.1.0"
description = "Truco Paulista LLM-vs-LLM benchmark: standalone engine, Game Arena harness components, OpenRouter model layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "game_arena",
    "absl-py>=2.1",
    "requests>=2.31",
    "tenacity>=8",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "kaggle-benchmarks>=0.6.1",
    "pytest>=8",
    "ruff>=0.17.0",
]

[tool.uv.sources]
# Game Arena harness, used as a dependency (not forked). Pinned to a commit.
game_arena = { git = "https://github.com/google-deepmind/game_arena", rev = "6ddcc7dac06321472f2f22fabdeceab97eebeb73" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["truco", "runner", "model_common.py", "openrouter_model.py", "kbench_model.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# Google/pyink layout, as in game_arena: 2-space indent, ~100 columns.
line-length = 100
indent-width = 2
extend-exclude = ["vendor", "runs", "docs"]

[tool.ruff.lint]
# Pyflakes, the core pycodestyle errors and import sorting. Long lines (E501) are not enforced.
select = ["E4", "E7", "E9", "F", "I"]
# House style the codebase uses on purpose: `l` loop names, named lambdas, `a; b` in tests.
ignore = ["E731", "E741", "E702"]

[tool.ruff.lint.per-file-ignores]
# Notebook-style task: the imports follow the cell that installs the wheels.
"kaggle_task/truco_cheap_rr.py" = ["E402"]

[tool.ruff.lint.isort]
# Google style: one alphabetical block per section, `import x` and `from x import y` mixed.
force-sort-within-sections = true
known-first-party = ["truco", "runner", "kaggle_task", "model_common", "openrouter_model", "kbench_model"]
